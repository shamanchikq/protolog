org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 migration opt-outs (same as Flutter 3.47's own app template). Both are deprecated and
# go away in AGP 10, but they can't be dropped yet (verified 2026-10 with Flutter 3.47.1 / AGP 9.1):
# - newDsl=true: the Flutter Gradle Plugin itself fails to apply (it still casts the android
#   extension to the legacy AbstractAppExtension).
# - builtInKotlin=true: shared_preferences_android 2.4.18 still applies the kotlin-android
#   plugin unconditionally, which AGP 9 rejects when built-in Kotlin is on.
# Retry removing them after a Flutter upgrade and plugin updates. If a line is deleted, the
# Flutter tool re-adds it on the next build, so set it explicitly to true to test.
android.builtInKotlin=false
android.newDsl=false
