org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9: built-in Kotlin is ON (shared_preferences_android >= 2.4.28 no longer applies the
# kotlin-android plugin itself). newDsl stays an opt-out, same as Flutter 3.47's app template:
# with newDsl=true the Flutter Gradle Plugin fails to apply (it still casts the android
# extension to the legacy AbstractAppExtension). The flag goes away in AGP 10 — retry after a
# Flutter upgrade. If the line is deleted, the Flutter tool re-adds it, so set it to true to test.
android.builtInKotlin=true
android.newDsl=false
