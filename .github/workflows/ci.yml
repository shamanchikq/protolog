# Static analysis, the test suite in two time zones, and a debug APK build.
# No secrets and no release builds: release signing needs the upload keystore,
# which never leaves the maintainer's machine (see android/app/build.gradle.kts).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      # Errors and warnings fail the job. Infos don't: the five UPPER_CASE
      # constant-name infos in lib/data.dart are intentional.
      - run: flutter analyze --no-fatal-infos

  test:
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # DST-sensitive tests (calendar steps, chart ranges, "Nd ago") only
        # discriminate in a zone with DST; UTC covers the no-DST case.
        tz: [UTC, Europe/Kyiv]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Show the time zone in effect
        run: date
      - run: flutter test

  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
